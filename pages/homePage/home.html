<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <main class="dashboard">
      <!-- Main Content -->
      <section class="main-content">
        <header class="topbar">
          <div>
            <h1 id="user-name"></h1>
          </div>

          <div class="user-profile">
            <button id="logout-btn">Logout</button>
          </div>
        </header>

        <!-- Summary Cards -->
        <section class="stats-grid">
          <article class="stat-card total-card">
            <div class="stat-icon green">
              <img
                src="./assets/svgs/tasks.svg"
                alt="tasks svg"
                height="40px"
              />
            </div>
            <div class="stat-info">
              <p>Total Issues</p>
              <h2 id="total-count"></h2>
            </div>
          </article>

          <article class="stat-card pending-card">
            <div class="stat-icon purple">
              <img
                src="./assets/svgs/pending.svg"
                alt="pending svg"
                height="40px"
              />
            </div>
            <div class="stat-info">
              <p>Pending Issues</p>
              <h2 id="pending-count"></h2>
            </div>
          </article>

          <article class="stat-card resolved-card">
            <div class="stat-icon blue">
              <img
                src="./assets/svgs/completed.svg"
                alt="completed svg"
                height="40px"
              />
            </div>
            <div class="stat-info">
              <p>Resolved Issues</p>
              <h2 id="resolved-count"></h2>
            </div>
          </article>
        </section>

        <!-- Table Section -->

        <div class="issues-table">
          <!-- Header row -->
          <div class="issue-row issue-header">
            <div class="cell title-column">Issue Title</div>
            <div class="cell">Category</div>
            <div class="cell">Reported By</div>
            <div class="cell">Date</div>
            <div class="cell">Status</div>
            <div class="cell admin-only">Action</div>
          </div>

          <!-- Supabase rows will be inserted here -->
          <div id="issues-container">
            <!-- ============ ISUE ROW ================== -->
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./home.js"></script>
  </body>
</html>
